<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NXHD Content Manager</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F0F5FA}
  .ncms-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#516280;font-size:14px}
  .ncms-spinner{width:36px;height:36px;border:3px solid rgba(0,102,255,.2);border-top-color:#0066FF;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="ncms-loading">
  <div class="ncms-spinner"></div>
  <div>Loading content manager…</div>
</div>
<script>
// Fallback for browsers that open the OAuth window without window.opener
// (e.g. as a new tab with noopener). The callback page stores the token in
// localStorage and redirects to /admin/#oauth-callback. We dispatch the same
// message Decap's GitHub OAuth listener is waiting for, retrying until Decap
// has loaded and attached its listener.
(function () {
  function dispatchAuth() {
    var token = localStorage.getItem('decap-cms-oauth-token');
    var provider = localStorage.getItem('decap-cms-oauth-provider') || 'github';
    if (!token) return false;
    localStorage.removeItem('decap-cms-oauth-token');
    localStorage.removeItem('decap-cms-oauth-provider');
    var payload = 'authorization:' + provider + ':success:' + JSON.stringify({ token: token, provider: provider });
    var attempts = 0;
    var maxAttempts = 24;
    var interval = setInterval(function () {
      window.dispatchEvent(new MessageEvent('message', {
        data: payload,
        origin: window.location.origin,
        source: window
      }));
      attempts++;
      if (attempts >= maxAttempts) clearInterval(interval);
    }, 250);
    return true;
  }
  window.addEventListener('storage', function (e) {
    if (e.key === 'decap-cms-oauth-token') dispatchAuth();
  });
  if (window.location.hash.indexOf('oauth-callback') !== -1) {
    dispatchAuth();
  }
})();
</script>
<script>
// Hide the custom loading spinner once Decap CMS has rendered its UI.
// Decap sometimes leaves the original body content in place and only overlays
// its own interface, so we poll for the Decap root and then fade out/remove
// our loader. Fallback timeout prevents the spinner from staying forever.
(function () {
  var loader = document.querySelector('.ncms-loading');
  if (!loader) return;
  var attempts = 0;
  var maxAttempts = 30;
  var interval = setInterval(function () {
    var decapRoot = document.getElementById('nc-root') || document.querySelector('.nc-app') || document.querySelector('[class*="nc-"]');
    attempts++;
    if (decapRoot || attempts >= maxAttempts) {
      clearInterval(interval);
      loader.style.transition = 'opacity 300ms ease';
      loader.style.opacity = '0';
      setTimeout(function () {
        loader.style.display = 'none';
      }, 350);
    }
  }, 200);
})();
</script>
<script src="https://unpkg.com/decap-cms@^3.6.2/dist/decap-cms.js"></script>
</body>
</html>
